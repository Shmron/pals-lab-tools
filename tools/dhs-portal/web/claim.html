<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DHS Explorer — Accept Invite</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand-row"><div class="brand-title">DHS Explorer<span class="dot">.</span></div></div>
    <div class="brand-sub" id="sub">Set your password to activate your account</div>
    <div id="msg"></div>
    <form id="claim-form" style="display:none">
      <div class="field"><label>Email</label><input type="text" id="claim-email" disabled></div>
      <div class="field"><label>Countries you'll have access to</label><input type="text" id="claim-countries" disabled></div>
      <div class="field"><label>Choose a password (min 8 characters)</label><input type="password" id="claim-password" minlength="8" required></div>
      <button class="btn" type="submit">Activate account</button>
    </form>
  </div>
</div>
<script>
const API = '/api/dhs';
const token = new URLSearchParams(location.search).get('token');
const msg = document.getElementById('msg');

async function init() {
  if (!token) { msg.innerHTML = '<div class="msg error">No invite token provided.</div>'; return; }
  const res = await fetch(`${API}/invite/${token}`);
  const data = await res.json();
  if (!data.ok) { msg.innerHTML = `<div class="msg error">${data.error}</div>`; return; }
  document.getElementById('claim-email').value = data.email;
  document.getElementById('claim-countries').value = (data.countries_allowed || []).join(', ') || '(none set)';
  document.getElementById('claim-form').style.display = 'block';
}
init();

document.getElementById('claim-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = document.getElementById('claim-password').value;
  const res = await fetch(`${API}/invite/${token}/claim`, {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({password}),
  });
  const data = await res.json();
  if (!data.ok) { msg.innerHTML = `<div class="msg error">${data.error}</div>`; return; }
  localStorage.setItem('dhs_token', data.token);
  msg.innerHTML = '<div class="msg ok">Account activated — redirecting…</div>';
  setTimeout(() => { location.href = '/'; }, 1200);
});
</script>
</body>
</html>
